stages:
  - sync

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

sync-frag-gitlab:
  stage: sync
  image: alpine/git:latest
  before_script:
    - apk add --no-cache bash
  script:
    - git config --global user.email "sync-bot@yuko.internal"
    - git config --global user.name "Yuko Sync Bot"
    - git subtree split --prefix=modules/editors/frag -b temp-frag
    - git push "https://oauth2:${GITLAB_SYNC_TOKEN}@gitlab.com/trynn-tech/frag.git" temp-frag:master --force
  rules:
    - changes:
        - "modules/editors/frag/**/*"

sync-synth-gitlab:
  stage: sync
  image: alpine/git:latest
  before_script:
    - apk add --no-cache bash
  script:
    - git config --global user.email "sync-bot@yuko.internal"
    - git config --global user.name "Yuko Sync Bot"
    - git subtree split --prefix=modules/synths -b temp-synth
    - git push "https://oauth2:${GITLAB_SYNC_TOKEN}@gitlab.com/trynn-tech/synth.git" temp-synth:master --force
  rules:
    - changes:
        - "modules/synths/**/*"
