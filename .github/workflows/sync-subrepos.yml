name: Sync Subrepos to GitHub

on:
  push:
    branches:
      - master
    paths:
      - 'modules/editors/frag/**'
      - 'modules/synths/**'
  workflow_dispatch:

jobs:
  sync-subrepos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SUBREPO_SYNC_PAT }}

      - name: Configure Git & Credentials
        run: |
          git config --global user.name "Yuko Sync Bot"
          git config --global user.email "sync-bot@yuko.internal"
          # Automatically injects your PAT for all GitHub HTTPS operations
          git config --global url."https://x-access-token:${{ secrets.SUBREPO_SYNC_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install git-subrepo
        run: |
          git clone https://github.com/git-commands/git-subrepo /tmp/git-subrepo
          echo "/tmp/git-subrepo/lib" >> $GITHUB_PATH

      - name: Push Frag Subrepo
        run: |
          git subrepo push modules/editors/frag

      - name: Push Synth Subrepo
        run: |
          git subrepo push modules/synths
